function toast(msg, type='ok'){
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div');
    el.id='toast';
    el.className='fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] px-5 py-3 rounded-2xl text-[13px] font-semibold shadow-2xl transition-all translate-y-20 opacity-0';
    document.body.appendChild(el);
  }
  el.textContent=msg;
  el.className=`fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] px-5 py-3 rounded-2xl text-[13px] font-semibold shadow-2xl transition-all ${type==='err'?'bg-red-600 text-white':'bg-[#111827] text-white'}`;
  el.style.transform='translate(-50%,0)'; el.style.opacity='1';
  setTimeout(()=>{el.style.transform='translate(-50%,80px)'; el.style.opacity='0';}, 3000);
}

      const fee = 0; // No fee for wallet transfer
      const ref = 'WLT-'+Date.now();
      // transaction doc
      await addDoc(collection(db, `sales_agents/${currentUser.uid}/transactions`), {
        type:'withdrawal', amount:-amt, fee, netAmount:amt-fee, bank: bankObj, status:'processing', reference:ref, createdAt: serverTimestamp()
      });
      // global withdrawals
      await addDoc(collection(db,'withdrawals'), {
        agentId: currentUser.uid, agentName: userData.name, amount:amt, fee, netAmount:amt-fee, bank: bankObj, reference:ref, status:'processing', createdAt: serverTimestamp()
      });
      await updateDoc(doc(db,'sales_agents', currentUser.uid), {
        balance: increment(-amt),
        pendingBalance: increment(amt),
        totalWithdrawn: increment(amt),
        withdrawalCount: increment(1)
      });
      toast(`Transfer ₦${amt.toLocaleString()} to Wallet processing - real Firebase`);
      $('withdrawModal').classList.add('hidden'); $('withdrawModal').classList.remove('flex');
      // simulate success after 3s
      setTimeout(async()=>{
        try{
          await updateDoc(doc(db,'sales_agents', currentUser.uid), {pendingBalance: increment(-amt)});
          toast('Transferred to Wallet successfully! Check your Wallet');
        }catch{}
      }, 3000);
    }catch(e){ $('wMsg').textContent=e.message; }
    $('doWithdraw').textContent='Withdraw Now'; $('doWithdraw').disabled=false;
  };

  // PIN modal
  $('savePin').onclick=async()=>{
    const p1=$('pinSet').value, p2=$('pinSet2').value;
    if(p1.length!==4||p2.length!==4){ $('pinMsg').textContent='Enter 4 digits'; return; }
    if(p1!==p2){ $('pinMsg').textContent='PINs do not match'; return; }
    $('savePin').textContent='Saving...';
    try{
      await updateDoc(doc(db,'sales_agents', currentUser.uid), {pin:p1});
      toast('PIN saved to Firebase - real');
      $('pinModal').classList.add('hidden'); $('pinModal').classList.remove('flex');
      openWithdraw();
    }catch(e){ $('pinMsg').textContent=e.message; $('savePin').textContent='Save PIN to Firebase'; }
  };

  window.openBankModal = ()=>{ $('bankModal').classList.remove('hidden'); $('bankModal').classList.add('flex'); };
  window.openWithdraw = async()=>{
    if(!userData.pin){
      $('pinModal').classList.remove('hidden'); $('pinModal').classList.add('flex'); return;
    }
    const banks = [{id:'wallet', bankName:'Wallet', accountNumber:'Wallet', accountName:'My Wallet Balance'}];
    if(banks.length===0){ toast('Add bank first - real','err'); openBankModal(); return; }
    document.getElementById('wBankList').innerHTML = banks.map(b=>`
      <label class="flex items-center gap-3 p-3 rounded-[12px] border border-[#EDE9FF] bg-[#F8F7FF] cursor-pointer hover:border-[#8B3DFF]">
        <input type="radio" name="wBank" value="${b.id}" class="w-4 h-4">
        <div class="flex-1"><div class="font-bold text-[13px]">${b.bankName}</div><div class="text-[11px] text-[#6B7280]">${b.accountNumber} • ${b.accountName}</div></div>
      </label>
    `).join('');
    $('withdrawModal').classList.remove('hidden'); $('withdrawModal').classList.add('flex');
    $('wMsg').textContent='';
  };

  setActive('overview');

  // real-time listeners
  if(unsubUser) unsubUser();
  unsubUser = onSnapshot(doc(db,'sales_agents', currentUser.uid), (snap)=>{
    if(snap.exists()){
      userData = snap.data();
      $('userName').textContent=userData.name;
      $('userEmail').textContent=userData.email;
      $('refCodeSide').textContent=userData.referralCode;
      $('avatar').textContent=userData.name.charAt(0).toUpperCase();
      if(document.getElementById('overviewPage')) renderOverview();
      if(document.getElementById('walletPage')) renderWallet();
    }
  });

  if(unsubTxns) unsubTxns();
  unsubTxns = onSnapshot(query(collection(db, `sales_agents/${currentUser.uid}/transactions`), orderBy('createdAt','desc')), (snap)=>{
    window.txns = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(document.getElementById('overviewPage')) renderOverview();
    if(document.getElementById('walletPage')) renderWallet();
    if(document.getElementById('earningsPage')) renderEarningsPage();
  });

  if(unsubRefs) unsubRefs();
  // FIX: Recover old signees data - query by both referrerId (new) AND referralCode (old) to prevent data loss
  // Old data might be saved with referrerCode, agentId, or salesAgentId - we check all
  const fetchAllRefs = async()=>{
    try{
      const all = new Map();
      const queries = [
        query(collection(db,'referrals'), where('referrerId','==', currentUser.uid)),
        query(collection(db,'referrals'), where('referrerCode','==', userData?.referralCode||'')),
        query(collection(db,'referrals'), where('agentId','==', currentUser.uid)),
        query(collection(db,'referrals'), where('salesAgentId','==', currentUser.uid))
      ];
      for(const q of queries){
        try{
          const snap = await getDocs(q);
          snap.docs.forEach(d=>{ all.set(d.id, {id:d.id, ...d.data()}); });
        }catch(e){ console.log('query skip', e.message); }
      }
      // Also listen real-time to main query
      window.refs = Array.from(all.values());
      if(document.getElementById('networkPage')) renderNetwork();
      if(document.getElementById('overviewPage')) renderOverview();
    }catch(e){ console.log(e); }
  };
  fetchAllRefs();
  unsubRefs = onSnapshot(query(collection(db,'referrals'), where('referrerId','==', currentUser.uid)), (snap)=>{
    const currentMap = new Map((window.refs||[]).map(r=>[r.id, r]));
    snap.docs.forEach(d=> currentMap.set(d.id, {id:d.id, ...d.data()}));
    window.refs = Array.from(currentMap.values());
    if(document.getElementById('networkPage')) renderNetwork();
    if(document.getElementById('overviewPage')) renderOverview();
  });
  // Also listen by referralCode to recover old signees
  if(userData?.referralCode){
    onSnapshot(query(collection(db,'referrals'), where('referrerCode','==', userData.referralCode)), (snap)=>{
      const currentMap = new Map((window.refs||[]).map(r=>[r.id, r]));
      snap.docs.forEach(d=> currentMap.set(d.id, {id:d.id, ...d.data()}));
      window.refs = Array.from(currentMap.values());
      if(document.getElementById('networkPage')) renderNetwork();
      if(document.getElementById('overviewPage')) renderOverview();
    });
  }
}
