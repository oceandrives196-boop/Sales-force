function toast(msg,type='ok'){
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; el.className='fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] px-5 py-3 rounded-2xl text-[13px] font-semibold shadow-2xl transition-all translate-y-20 opacity-0'; document.body.appendChild(el); }
  el.textContent=msg;
  el.className=`fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] px-5 py-3 rounded-2xl text-[13px] font-semibold shadow-2xl transition-all ${type==='err'?'bg-red-600 text-white':'bg-[#111827] text-white'}`;
  el.style.transform='translate(-50%,0)'; el.style.opacity='1';
  setTimeout(()=>{el.style.transform='translate(-50%,80px)'; el.style.opacity='0';},3200);
}

let _teamData=[], _teamFilter='all';
function renderTeamList(){
  const list=$('teamList'); if(!list) return;
  let data=_teamData; if(_teamFilter!=='all') data=data.filter(d=>d.memberRole===_teamFilter);
  if(data.length===0){ list.innerHTML=`<div class="text-[12px] text-[#9CA3AF]">No ${ _teamFilter==='all'?'team':_teamFilter } yet</div>`; return; }
  list.innerHTML=data.map(m=>`<div class="flex justify-between items-center p-3 rounded-[14px] bg-[#F8F7FF] border"><div class="flex gap-2.5 items-center"><div class="w-9 h-9 rounded-full bg-white border grid place-items-center font-black text-[12px] text-[#7C3AED]">${(m.memberRole||'').charAt(0).toUpperCase()}</div><div><div class="font-bold text-[13px]">${m.memberName||m.memberEmail}</div><div class="text-[11px] text-[#6B7280]">${m.memberRole} • ${m.memberEmail} • linked by email • 2% forever</div></div></div><div class="text-[10px] px-2 py-1 rounded-full bg-white border font-bold uppercase">${m.memberRole}</div></div>`).join('');
}

async function loadUserData(){
  if(!currentUser) return;
  const uid=currentUser.uid, email=currentUser.email.toLowerCase(), emailKey=sanitizeEmail(email);
  if(unsubUser) unsubUser();
  unsubUser=onSnapshot(doc(db,'users',uid),(snap)=>{ if(snap.exists()){ userData=snap.data(); updateUI(); } else { getDoc(doc(db,'salesforce_agents',emailKey)).then(d=>{ if(d.exists()){ userData=d.data(); updateUI(); } }); } });
  if(unsubWallet) unsubWallet();
  unsubWallet=onSnapshot(doc(db,'wallets',emailKey),(snap)=>{ if(snap.exists()){ const w=snap.data(); $('walletBal').textContent=`₦${(w.balance||0).toLocaleString()}`; $('walletEmail').textContent=w.email||email; $('walletMeta').textContent=`Wallet: ${w.email||email} • Same as Salesforce`; } else { $('walletBal').textContent=`₦0`; $('walletEmail').textContent=email; } });
  if(unsubTxns) unsubTxns();
  const qTxn=query(collection(db,'transactions'),where('uid','==',uid),orderBy('createdAt','desc'));
  unsubTxns=onSnapshot(qTxn,(snap)=>{ const txns=snap.docs.map(d=>({id:d.id,...d.data()})); const wList=$('walletTxns'); if(wList){ const wTx=txns.filter(t=>t.type==='withdraw_to_wallet'); if(wTx.length===0) wList.innerHTML='<div class="text-[12px] text-[#9CA3AF]">No withdrawals yet</div>'; else wList.innerHTML=wTx.map(t=>`<div class="flex justify-between items-center p-3 rounded-[12px] bg-[#F8F7FF] border"><div><div class="font-bold text-[13px]">To wallet • ${t.walletEmail||email}</div><div class="text-[11px] text-[#6B7280]">${t.reference||''} • ${t.createdAt?.toDate?.()?.toLocaleString()||''}</div></div><div class="text-right"><div class="font-black">₦${Math.abs(t.amount).toLocaleString()}</div><div class="text-[10px] text-green-600 uppercase font-bold">success</div></div></div>`).join(''); } });
  if(unsubTeam) unsubTeam();
  const qTeam=query(collection(db,'salesforce_teams'),where('salesforceEmail','==',email),orderBy('createdAt','desc'));
  unsubTeam=onSnapshot(qTeam,(snap)=>{ _teamData=snap.docs.map(d=>d.data()); $('teamTotal').textContent=`${_teamData.length} team`; $('providerCount').textContent=_teamData.filter(t=>['driver','rider','chef'].includes(t.memberRole)).length; $('customerCount').textContent=_teamData.filter(t=>t.memberRole==='customer').length; renderTeamList(); });
  function updateUI(){ if(!userData) return; $('dashName').textContent=userData.name||'Salesforce'; $('totalEarned').textContent=`₦${(userData.totalEarned||0).toLocaleString()}`; const info=$('accountInfo'); if(info) info.textContent=`${userData.email} • Independent Salesforce • 2% from team • linked by email`; }
}

async function quickOnboard(){
  const name=$('obName').value.trim(), phone=$('obPhone').value.trim(), role=$('obRole').value, email=$('obEmail').value.trim().toLowerCase(), extra=$('obExtra').value.trim();
  const msg=$('obMsg');
  if(!name||!phone||!email){ msg.textContent='Fill all fields'; msg.className='text-[11px] text-center font-semibold text-red-600'; return; }
  msg.textContent='Onboarding...'; msg.className='text-[11px] text-center font-semibold text-[#6B7280]';
  try{
    const salesforceEmail=currentUser.email.toLowerCase(), salesforceKey=sanitizeEmail(salesforceEmail), memberKey=sanitizeEmail(email);
    await addDoc(collection(db,'salesforce_teams'),{ salesforceEmail, salesforceKey, memberEmail:email, memberKey, memberRole:role, memberName:name, memberPhone:phone, memberExtra:extra, createdAt: serverTimestamp() });
    await setDoc(doc(db,'onboarded_members',memberKey),{ name, phone, email, role, extra, onboardedByEmail:salesforceEmail, onboardedByKey:salesforceKey, createdAt: serverTimestamp() },{merge:true});
    // also create entry in role collection linked by email
    const base={ name, email, phone, role, onboardedByEmail:salesforceEmail, onboardedByKey:salesforceKey, bikeNumber:extra, createdAt: serverTimestamp(), emailKey:memberKey };
    if(role==='driver') await setDoc(doc(db,'drivers',memberKey),{...base,id:memberKey,totalEarnings:0},{merge:true});
    if(role==='rider') await setDoc(doc(db,'riders',memberKey),{...base,id:memberKey},{merge:true});
    if(role==='chef') await setDoc(doc(db,'chefs',memberKey),{...base,id:memberKey},{merge:true});
    if(role==='customer') await setDoc(doc(db,'customers',memberKey),{...base,id:memberKey},{merge:true});
    msg.textContent=`✓ ${role} ${name} onboarded - linked by email. You earn 2% when they use services`; msg.className='text-[11px] text-center font-semibold text-green-600'; toast(`${role} onboarded`);
    $('obName').value=''; $('obPhone').value=''; $('obEmail').value=''; $('obExtra').value='';
  }catch(e){ msg.textContent=e.message; msg.className='text-[11px] text-center font-semibold text-red-600'; }
}

async function simulateTeamOrder(){
  if(_teamData.length===0){ toast('Onboard a driver, rider, chef or customer first','err'); return; }
  const orderAmtStr=prompt('Enter service amount from your team member (e.g. 5000):','5000');
  if(!orderAmtStr) return;
  const orderAmt=Number(orderAmtStr.replace(/[^0-9]/g,''));
  if(!orderAmt||orderAmt<=0){ toast('Invalid amount','err'); return; }
  const comm=Math.floor(orderAmt*0.02);
  const member=_teamData[Math.floor(Math.random()*_teamData.length)];
  try{
    const refId='ORD-'+Date.now();
    await setDoc(doc(collection(db,'transactions')),{ uid: currentUser.uid, email: currentUser.email.toLowerCase(), emailKey: sanitizeEmail(currentUser.email.toLowerCase()), amount: comm, type:'commission', description:`2% from ${member.memberRole} ${member.memberName} service ₦${orderAmt}`, reference: refId, status:'success', createdAt: serverTimestamp() });
    await updateDoc(doc(db,'users',currentUser.uid),{ totalEarned: increment(comm) });
    try{ await updateDoc(doc(db,'salesforce_agents',sanitizeEmail(currentUser.email.toLowerCase())),{ totalEarned: increment(comm) }); }catch{}
    toast(`Service ₦${orderAmt.toLocaleString()} → you earned ₦${comm} (2%) from ${member.memberName}`);
  }catch(e){ toast(e.message,'err'); }
}

async function withdrawToWallet(){
  if(!currentUser||!userData){ toast('No account data','err'); return; }
  const email=currentUser.email.toLowerCase(), emailKey=sanitizeEmail(email);
  const amount=Number(userData.totalEarned||0);
  if(amount<=0){ toast('No earnings to withdraw','err'); return; }
  const btn=$('btnWithdraw'); btn.textContent='PROCESSING...'; btn.disabled=true;
  try{
    const walletRef=doc(db,'wallets',emailKey);
    const snap=await getDoc(walletRef);
    if(!snap.exists()) await setDoc(walletRef,{ email, emailKey, uid: currentUser.uid, balance:0, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
    const refId='WTH_'+Date.now();
    await setDoc(doc(collection(db,'transactions')),{ uid: currentUser.uid, email, emailKey, walletEmail: email, amount: -amount, type:'withdraw_to_wallet', description:`Salesforce withdraw to wallet (${email}) - same email`, reference: refId, status:'success', createdAt: serverTimestamp() });
    await updateDoc(walletRef,{ balance: increment(amount), updatedAt: serverTimestamp(), uid: currentUser.uid, email });
    await updateDoc(doc(db,'users',currentUser.uid),{ totalEarned: 0, lastWithdrawAt: serverTimestamp(), lastWithdrawAmount: amount });
    try{ await updateDoc(doc(db,'salesforce_agents',emailKey),{ totalEarned: 0 }); }catch{}
    toast(`✓ ₦${amount.toLocaleString()} moved to wallet (${email})`);
  }catch(e){ toast(e.message,'err'); }finally{ btn.textContent='WITHDRAW TO WALLET'; btn.disabled=false; }
}

onAuthStateChanged(auth,(user)=>{ if(user){ currentUser=user; renderDashboard(); }else{ currentUser=null; userData=null; if(unsubUser) unsubUser(); if(unsubTxns) unsubTxns(); if(unsubWallet) unsubWallet(); if(unsubTeam) unsubTeam(); renderAuth(); } });
renderAuth();
</script>
