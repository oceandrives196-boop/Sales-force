const sanitizeEmail = e=>e.toLowerCase().replace(/[^a-z0-9]/g,'_');
function toast(msg,type='ok'){
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; el.className='fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] px-6 py-3.5 rounded-full text-[13px] font-semibold shadow-[0_12px_32px_rgba(0,0,0,.18)] max-w-[92%] text-center transition-all translate-y-20 opacity-0 flex items-center gap-2'; document.body.appendChild(el); }
  el.innerHTML = (type==='err' ? '⚠️ ' : '✨ ') + msg;
  el.className=`fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] px-6 py-3.5 rounded-full text-[13px] font-semibold shadow-[0_12px_32px_rgba(0,0,0,.18)] max-w-[92%] text-center transition-all flex items-center gap-2 ${type==='err'?'bg-[#111827] text-white border border-red-500/20':'bg-[#111827] text-white'}`;
  el.style.transform='translate(-50%,0)'; el.style.opacity='1';
  setTimeout(()=>{el.style.transform='translate(-50%,80px)'; el.style.opacity='0';},3800);
}
function switchPage(p){
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
  const target=document.getElementById('page-'+p); if(target) target.classList.add('active');
  document.querySelectorAll('.navBtn').forEach(b=>{
    const isActive = b.dataset.page===p;
    b.className = isActive
      ? 'navBtn nav-pill active-nav flex items-center gap-2 px-5 py-2.5 rounded-full text-[12px] font-bold whitespace-nowrap'
      : 'navBtn nav-pill flex items-center gap-2 px-5 py-2.5 rounded-full bg-white border border-black/[0.06] text-[#6B7280] text-[12px] font-bold hover:border-black/10 hover:text-[#111827] whitespace-nowrap';
  });
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderVerifyRequired(user){
  document.getElementById('app').innerHTML=`
  <div class="min-h-screen w-full flex items-center justify-center p-4 bg-[#F6F5FF]">
    <div class="w-full max-w-[400px] bg-white rounded-[28px] shadow-[0_20px_60px_rgba(0,0,0,.08)] border border-black/[0.04] p-8 text-center">

      <h2 class="mt-4 text-[22px] font-extrabold tracking-tight">Verify your email</h2>
      <p class="mt-2 text-[13px] text-[#6B7280] leading-relaxed">You cannot proceed until email is authenticated. Link sent to <b class="text-[#111827]">${user.email}</b></p>
      <div class="mt-6 space-y-2">
        <button id="btnCheckVerified" class="w-full h-12 rounded-full bg-[#111827] text-white font-bold text-[13px] shadow">I HAVE VERIFIED - CONTINUE</button>
        <button id="btnResend" class="w-full h-12 rounded-full bg-[#F8F7FF] border border-black/[0.06] font-bold text-[13px]">RESEND EMAIL</button>
        <button id="btnLogout2" class="w-full h-11 rounded-full bg-white border text-[12px] font-bold">Logout</button>
      </div>
      <div id="verifyMsg" class="mt-3 text-[12px] font-semibold min-h-[20px]"></div>
    </div>
  </div>`;
  $('btnCheckVerified').onclick=async()=>{
    $('verifyMsg').textContent='Checking...';
    try{ await user.reload(); if(user.emailVerified){ try{ await updateDoc(doc(db,'users',user.uid),{ emailVerified:true }); await updateDoc(doc(db,'salesforce_agents',sanitizeEmail(user.email.toLowerCase())),{ emailVerified:true }); }catch{} toast('Verified'); }else{ $('verifyMsg').textContent='Not verified yet'; $('verifyMsg').className='mt-3 text-[12px] font-semibold text-red-600'; } }catch(e){ $('verifyMsg').textContent=e.message; }
  };
  $('btnResend').onclick=async()=>{ try{ await sendEmailVerification(user); $('verifyMsg').textContent='✓ Sent again'; toast('Sent'); }catch(e){ $('verifyMsg').textContent=e.message; } };
  $('btnLogout2').onclick=async()=>{ await signOut(auth); };
}

async function loadUserData(){
  if(!currentUser) return;
  const uid=currentUser.uid, email=currentUser.email.toLowerCase(), emailKey=sanitizeEmail(email);
  if(unsubUser) unsubUser();
  unsubUser=onSnapshot(doc(db,'users',uid),(snap)=>{ if(snap.exists()){ userData=snap.data(); updateUI(); } else { getDoc(doc(db,'salesforce_agents',emailKey)).then(d=>{ if(d.exists()){ userData=d.data(); updateUI(); } }); } });
  if(unsubWallet) unsubWallet();
  unsubWallet=onSnapshot(doc(db,'wallets',emailKey),(snap)=>{ const balEl=$('walletBal'), emailEl=$('walletEmail'); if(snap.exists()){ const w=snap.data(); if(balEl) balEl.textContent=`₦${(w.balance||0).toLocaleString()}`; if(emailEl) emailEl.textContent=w.email||email; } else { if(balEl) balEl.textContent=`₦0`; if(emailEl) emailEl.textContent=email; } });
  if(unsubTxns) unsubTxns();
  const qTxn=query(collection(db,'transactions'),where('uid','==',uid));
  unsubTxns=onSnapshot(qTxn,(snap)=>{
    _allTxns=snap.docs.map(d=>({id:d.id,...d.data()})); _allTxns.sort((a,b)=> (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    renderFlow();
    const wList=$('walletTxns'); if(wList){ const wTx=_allTxns.filter(t=>t.type==='withdraw_to_wallet'); if(wTx.length===0) wList.innerHTML='<div class="text-[12px] text-[#9CA3AF]">No withdrawals yet</div>'; else wList.innerHTML=wTx.map(t=>`<div class="flex justify-between items-center p-3 rounded-[14px] bg-white border shadow-sm"><div><div class="font-bold text-[13px]">To real wallet • ${t.walletEmail||email}</div><div class="text-[11px] text-[#6B7280]">${t.reference||''}</div></div><div class="font-black">₦${Math.abs(t.amount).toLocaleString()}</div></div>`).join(''); }
    const commissions=_allTxns.filter(t=>t.type==='commission');
    const totalTripsEl=$('statTotalTrips'), totalEarnEl=$('statTotalEarn'), statsOrdersEl=$('statsOrders'), statsEarnedEl=$('statsEarned');
    if(totalTripsEl) totalTripsEl.textContent=commissions.length; if(statsOrdersEl) statsOrdersEl.textContent=commissions.length;
    const totalComm=commissions.reduce((s,t)=>s+(t.amount||0),0); if(totalEarnEl) totalEarnEl.textContent=`₦${totalComm.toLocaleString()}`; if(statsEarnedEl) statsEarnedEl.textContent=`₦${totalComm.toLocaleString()}`;
  });
  if(unsubTeam) unsubTeam();
  const qTeam=query(collection(db,'salesforce_teams'),where('salesforceEmail','==',email));
  unsubTeam=onSnapshot(qTeam,(snap)=>{
    _teamData=snap.docs.map(d=>d.data()); _teamData.sort((a,b)=> (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    const totalEl=$('teamTotal'), provEl=$('providerCount'), custEl=$('customerCount'), teamSizeEl=$('statTeamSize'), statsTeamEl=$('statsTeam');
    if(totalEl) totalEl.textContent=`${_teamData.length} team`; if(provEl) provEl.textContent=_teamData.filter(t=>['driver','rider','chef'].includes(t.memberRole)).length; if(custEl) custEl.textContent=_teamData.filter(t=>t.memberRole==='customer').length; if(teamSizeEl) teamSizeEl.textContent=_teamData.length; if(statsTeamEl) statsTeamEl.textContent=_teamData.length;
    const bD=$('bDrivers'), bR=$('bRiders'), bC=$('bChefs'), bCu=$('bCustomers');
    if(bD) bD.textContent=_teamData.filter(t=>t.memberRole==='driver').length; if(bR) bR.textContent=_teamData.filter(t=>t.memberRole==='rider').length; if(bC) bC.textContent=_teamData.filter(t=>t.memberRole==='chef').length; if(bCu) bCu.textContent=_teamData.filter(t=>t.memberRole==='customer').length;
    renderTeamList();
  });
  function updateUI(){
    if(!userData) return;
    const nameEl=$('dashName'), earnEl=$('totalEarned'), pName=$('profileName'), pEmail=$('profileEmail'), pInit=$('profileInitial'), pfName=$('pfName'), pfPhone=$('pfPhone'), pfEmail=$('pfEmail');
    if(nameEl) nameEl.textContent=userData.name||'Salesforce'; if(earnEl) earnEl.textContent=`₦${(userData.totalEarned||0).toLocaleString()}`; if(pName) pName.textContent=userData.name||'Salesforce'; if(pEmail) pEmail.textContent=userData.email||email; if(pInit) pInit.textContent=(userData.name||'S').charAt(0).toUpperCase(); if(pfName) pfName.value=userData.name||''; if(pfPhone) pfPhone.value=userData.phone||''; if(pfEmail) pfEmail.value=userData.email||email;
  }
}

async function quickOnboard(){
  const btn=$('btnOnboard'), name=$('obName').value.trim(), phone=$('obPhone').value.trim(), role=$('obRole').value, email=$('obEmail').value.trim().toLowerCase(), extra=$('obExtra').value.trim();
  const msg=$('obMsg'); if(!name||!phone||!email){ msg.textContent='Fill all fields'; msg.className='text-[11px] text-center font-semibold text-red-600'; return; }
  btn.disabled=true; btn.textContent='CHECKING...'; msg.textContent='Checking duplicates...'; msg.className='text-[11px] text-center font-semibold text-[#6B7280]';
  try{
    const salesforceEmail=currentUser.email.toLowerCase(), memberKey=sanitizeEmail(email);
    const normalizedPhone=phone.replace(/\s+/g,'').toLowerCase();
    const emailDocs = await Promise.all([
      getDoc(doc(db,'onboarded_members',memberKey)),
      getDoc(doc(db,'drivers',memberKey)),
      getDoc(doc(db,'riders',memberKey)),
      getDoc(doc(db,'chefs',memberKey)),
      getDoc(doc(db,'customers',memberKey)),
      getDoc(doc(db,'salesforce_agents',memberKey)),
    ]);
    const labels = ['onboarded_members','drivers','riders','chefs','customers','salesforce_agents'];
    for(let i=0;i<emailDocs.length;i++){
      if(emailDocs[i].exists()){
        throw new Error(`This email (${email}) is already registered as ${labels[i]}. No driver/customer/chef/rider registered twice.`);
      }
    }
    const dupCheck = await new Promise((resolve)=>{
      const q = query(collection(db,'salesforce_teams'), where('memberKey','==',memberKey));
      const unsub = onSnapshot(q, snap=>{ unsub(); resolve(snap); }, ()=>resolve({empty:true}));
    });
    if(dupCheck && !dupCheck.empty){
      const ex = dupCheck.docs[0].data();
      throw new Error(`Duplicate blocked: ${email} already onboarded as ${ex.memberRole} by ${ex.salesforceEmail}.`);
    }
    if(_teamData.some(t=> (t.memberPhone||'').replace(/\s+/g,'').toLowerCase()===normalizedPhone)){
      throw new Error(`Phone ${phone} already used in your team. No duplicate allowed.`);
    }
    const phoneChecks = [
      query(collection(db,'onboarded_members'), where('phone','==',phone)),
      query(collection(db,'drivers'), where('phone','==',phone)),
      query(collection(db,'riders'), where('phone','==',phone)),
      query(collection(db,'chefs'), where('phone','==',phone)),
      query(collection(db,'customers'), where('phone','==',phone)),
    ];
    for(const q of phoneChecks){
      const snap = await new Promise((resolve)=>{
        const u = onSnapshot(q, s=>{ u(); resolve(s); }, ()=>resolve({empty:true}));
      });
      if(snap && !snap.empty){
        throw new Error(`Phone ${phone} is already registered. Duplicate not allowed.`);
      }
    }
    msg.textContent='Onboarding...';
    const teamDoc={ salesforceEmail, salesforceKey:sanitizeEmail(salesforceEmail), memberEmail:email, memberKey, memberRole:role, memberName:name, memberPhone:phone, memberExtra:extra, createdAt: serverTimestamp() };
    await addDoc(collection(db,'salesforce_teams'),teamDoc);
    _teamData.unshift({ ...teamDoc, createdAt: { seconds: Date.now()/1000 } }); renderTeamList();
    const totalEl=$('teamTotal'); if(totalEl) totalEl.textContent=`${_teamData.length} team`;
    try{
      await setDoc(doc(db,'onboarded_members',memberKey),{ name, phone, email, role, extra, onboardedByEmail:salesforceEmail, createdAt: serverTimestamp() },{merge:false});
      const base={ name, email, phone, role, onboardedByEmail:salesforceEmail, bikeNumber:extra, createdAt: serverTimestamp(), emailKey:memberKey };
      if(role==='driver') await setDoc(doc(db,'drivers',memberKey),{...base,id:memberKey,totalEarnings:0},{merge:false});
      if(role==='rider') await setDoc(doc(db,'riders',memberKey),{...base,id:memberKey},{merge:false});
      if(role==='chef') await setDoc(doc(db,'chefs',memberKey),{...base,id:memberKey},{merge:false});
      if(role==='customer') await setDoc(doc(db,'customers',memberKey),{...base,id:memberKey},{merge:false});
      await setDoc(doc(db,'wallets',memberKey),{ email, emailKey:memberKey, balance:0, name, createdAt: serverTimestamp(), updatedAt: serverTimestamp() },{merge:true});
    }catch(e){
      console.error(e);
      if((e.message||'').toLowerCase().includes('exists')) throw new Error(`This ${role} already exists (${email}). Duplicate blocked.`);
      throw e;
    }
    msg.textContent=`✓ Real ${role} ${name} onboarded`; msg.className='text-[11px] text-center font-semibold text-green-600'; toast(`Real ${role} onboarded`);
    $('obName').value=''; $('obPhone').value=''; $('obEmail').value=''; $('obExtra').value='';
  }catch(e){
    const m=e.message||'Error';
    msg.textContent=m; msg.className='text-[11px] text-center font-semibold text-red-600'; toast(m,'err');
  }
  finally{ btn.disabled=false; btn.textContent='ONBOARD REAL PROVIDER'; }
}

async function withdrawToWallet(){
  if(!currentUser||!userData){ toast('No account','err'); return; }
  const email=currentUser.email.toLowerCase(), emailKey=sanitizeEmail(email); const amount=Number(userData.totalEarned||0);
  if(amount<=0){ toast('No real earnings','err'); return; }
  const btn=$('btnWithdraw'); btn.textContent='PROCESSING...'; btn.disabled=true;
  try{
    const walletRef=doc(db,'wallets',emailKey); const snap=await getDoc(walletRef);
    if(!snap.exists()) await setDoc(walletRef,{ email, emailKey, uid: currentUser.uid, balance:0, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
    await addDoc(collection(db,'transactions'),{ uid: currentUser.uid, email, emailKey, walletEmail: email, amount: -amount, type:'withdraw_to_wallet', description:`Withdraw to real wallet`, reference:'WTH_'+Date.now(), status:'success', createdAt: serverTimestamp() });
    await updateDoc(walletRef,{ balance: increment(amount), updatedAt: serverTimestamp(), uid: currentUser.uid, email });
    await updateDoc(doc(db,'users',currentUser.uid),{ totalEarned: 0 });
    try{ await updateDoc(doc(db,'salesforce_agents',emailKey),{ totalEarned: 0 }); }catch{}
    toast(`✓ ₦${amount.toLocaleString()} moved to real wallet`);
  }catch(e){ toast(e.message,'err'); }finally{ btn.textContent='WITHDRAW TO REAL WALLET'; btn.disabled=false; }
}

async function saveProfile(){
  const name=$('pfName').value.trim(), phone=$('pfPhone').value.trim(), msg=$('pfMsg');
  if(!name||!phone){ msg.textContent='Fill name & phone'; msg.className='text-[11px] text-center font-semibold text-red-600'; return; }
  msg.textContent='Saving...'; msg.className='text-[11px] text-center font-semibold text-[#6B7280]';
  try{ await updateDoc(doc(db,'users',currentUser.uid),{ name, phone }); await updateDoc(doc(db,'salesforce_agents',sanitizeEmail(currentUser.email.toLowerCase())),{ name, phone }); try{ await updateProfile(currentUser,{ displayName:name }); }catch{} msg.textContent='✓ Saved'; msg.className='text-[11px] text-center font-semibold text-green-600'; toast('Profile saved'); }catch(e){ msg.textContent=e.message; }
}

onAuthStateChanged(auth, async (user)=>{
  if(user){ try{ await user.reload(); }catch{} currentUser=user; if(!user.emailVerified){ renderVerifyRequired(user); return; } renderDashboard(); }else{ currentUser=null; userData=null; if(unsubUser) unsubUser(); if(unsubTxns) unsubTxns(); if(unsubWallet) unsubWallet(); if(unsubTeam) unsubTeam(); renderAuth(); }
});
renderAuth();
</script>
