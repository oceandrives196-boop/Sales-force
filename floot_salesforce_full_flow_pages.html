  apiKey: "AIzaSyBVIJq5napb_egiLdKhGtySZoPeLUkY9Q4",
  authDomain: "floot-delivery.firebaseapp.com",
  projectId: "floot-delivery",
  storageBucket: "floot-delivery.firebasestorage.app",
  messagingSenderId: "786230599434",
  appId: "1:786230599434:web:e1913bd8c2e69a7e1c64f3"
};
const appCore = initializeApp(coreConfig);
const auth = getAuth(appCore);
const db = getFirestore(appCore);

let currentUser=null, userData=null, unsubUser=null, unsubTxns=null, unsubWallet=null, unsubTeam=null, currentPage='dashboard';
const $ = id=>document.getElementById(id);
const sanitizeEmail = e=>e.toLowerCase().replace(/[^a-z0-9]/g,'_');
function toast(msg,type='ok'){
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; el.className='fixed bottom-24 left-1/2 -translate-x-1/2 z-[100] px-5 py-3 rounded-2xl text-[13px] font-semibold shadow-2xl max-w-[90%] text-center transition-all translate-y-20 opacity-0'; document.body.appendChild(el); }
  el.textContent=msg;
  el.className=`fixed bottom-24 left-1/2 -translate-x-1/2 z-[100] px-5 py-3 rounded-2xl text-[13px] font-semibold shadow-2xl max-w-[90%] text-center transition-all ${type==='err'?'bg-red-600 text-white':'bg-[#111827] text-white'}`;
  el.style.transform='translate(-50%,0)'; el.style.opacity='1';
  setTimeout(()=>{el.style.transform='translate(-50%,80px)'; el.style.opacity='0';},3500);
}
function switchPage(p){
  currentPage=p;
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
  const target=document.getElementById('page-'+p);
  if(target) target.classList.add('active');
  document.querySelectorAll('.navBtn').forEach(b=>{ if(b.dataset.page===p) b.className='navBtn flex flex-col items-center gap-1 px-3 py-2 rounded-[14px] bg-[#111827] text-white text-[11px] font-bold'; else b.className='navBtn flex flex-col items-center gap-1 px-3 py-2 rounded-[14px] bg-white border text-[#6B7280] text-[11px] font-bold'; });
}

function renderAuth(){
  document.getElementById('app').innerHTML=`

      <div class="flex items-center gap-3"><img src="https://ik.imagekit.io/anyl9hsxh/FB_IMG_1773667740309.jpg?updatedAt=1789125101906" class="w-11 h-11 rounded-full border-2 border-white object-cover"><span class="text-white font-extrabold text-[20px]">FLOOT NG</span><span class="ml-2 bg-white text-[#7C3AED] text-[10px] font-black px-2.5 py-1 rounded-full">SALESFORCE</span></div>
      <div class="mt-10"><h1 class="text-[40px] lg:text-[54px] font-[800] leading-[0.95] text-white">Salesforce</h1><p class="mt-5 text-[15px] leading-[1.6] text-white/85 max-w-[360px]">Independent people who onboard service providers — drivers, riders, chefs and customers. Earn 2% forever when they use Floot services.</p></div>
      <div class="hidden lg:block rounded-[14px] bg-white/10 border border-white/15 p-3 text-[12px] text-white">Email must be verified before you can proceed.</div>
    </div>
    <div class="flex-1 flex items-center justify-center p-4 lg:p-12 bg-[#F8F7FF] -mt-6 lg:mt-0">
      <div class="w-full max-w-[420px] bg-white rounded-[28px] shadow-[0_20px_60px_rgba(17,24,39,0.08)] p-6 sm:p-8">
        <h2 class="text-[22px] font-bold">Salesforce</h2><p class="text-[13px] text-[#6B7280] mt-1">Email authentication required</p>
        <div class="mt-6 grid grid-cols-2 gap-2 p-1.5 bg-[#F8F7FF] rounded-full"><button id="tabSignup" class="h-10 rounded-full text-[14px] font-semibold bg-[#111827] text-white">Sign Up</button><button id="tabLogin" class="h-10 rounded-full text-[14px] font-semibold text-[#6B7280]">Login</button></div>
        <div id="signupForm" class="mt-6 space-y-3">
          <input id="suName" class="w-full h-[48px] rounded-full bg-[#F8F7FF] border px-5 text-[14px] outline-none focus:border-[#7C3AED]" placeholder="Full name *">
          <input id="suEmail" class="w-full h-[48px] rounded-full bg-[#F8F7FF] border px-5 text-[14px] outline-none focus:border-[#7C3AED]" placeholder="Email *" type="email">
          <input id="suPhone" class="w-full h-[48px] rounded-full bg-[#F8F7FF] border px-5 text-[14px] outline-none focus:border-[#7C3AED]" placeholder="Phone *">
          <input id="suPass" class="w-full h-[48px] rounded-full bg-[#F8F7FF] border px-5 text-[14px] outline-none focus:border-[#7C3AED]" placeholder="Password min 6 *" type="password">
          <button id="btnSignup" class="w-full h-[52px] rounded-full bg-[#7C3AED] text-white font-bold text-[14px]">CREATE ACCOUNT</button>
          <div id="suMsg" class="text-[12px] text-center font-semibold min-h-[20px]"></div>
        </div>
        <div id="loginForm" class="mt-6 space-y-3 hidden">
          <input id="liEmail" class="w-full h-[48px] rounded-full bg-[#F8F7FF] border px-5 text-[14px] outline-none focus:border-[#7C3AED]" placeholder="Email" type="email">
          <input id="liPass" class="w-full h-[48px] rounded-full bg-[#F8F7FF] border px-5 text-[14px] outline-none focus:border-[#7C3AED]" placeholder="Password" type="password">
          <button id="btnLogin" class="w-full h-[52px] rounded-full bg-[#111827] text-white font-bold text-[14px]">LOGIN</button>
          <button id="btnForgot" class="w-full text-[11px] text-[#7C3AED] font-bold mt-1">Forgot password?</button>
          <div id="liMsg" class="text-[12px] text-center font-semibold min-h-[20px]"></div>

  $('tabLogin').onclick=()=>{ $('tabLogin').className='h-10 rounded-full text-[14px] font-semibold bg-[#111827] text-white'; $('tabSignup').className='h-10 rounded-full text-[14px] font-semibold text-[#6B7280]'; $('loginForm').classList.remove('hidden'); $('signupForm').classList.add('hidden'); };
  $('btnForgot').onclick=async()=>{ const email=$('liEmail').value.trim().toLowerCase(); if(!email){ toast('Enter email','err'); return; } try{ await sendPasswordResetEmail(auth,email); toast('Reset email sent'); }catch(e){ toast(e.code,'err'); } };
  $('btnSignup').onclick=async()=>{
    const btn=$('btnSignup'), name=$('suName').value.trim(), email=$('suEmail').value.trim().toLowerCase(), phone=$('suPhone').value.trim(), pass=$('suPass').value.trim();
    const msg=$('suMsg'); if(!name||!email||!phone||!pass){ msg.textContent='Fill all fields'; msg.className='text-[12px] text-center font-semibold text-red-600'; return; }
    if(pass.length<6){ msg.textContent='Password min 6'; msg.className='text-[12px] text-center font-semibold text-red-600'; return; }
    btn.disabled=true; btn.textContent='CREATING...'; msg.textContent='Creating...'; msg.className='text-[12px] text-center font-semibold text-[#6B7280]';
    try{
      const cred=await createUserWithEmailAndPassword(auth,email,pass);

    btn.disabled=true; btn.textContent='CHECKING...'; msg.textContent='Checking...'; msg.className='text-[12px] text-center font-semibold text-[#6B7280]';
    try{
      const cred=await signInWithEmailAndPassword(auth,email,pass);
      await cred.user.reload();
      if(!cred.user.emailVerified){ msg.textContent='Email not verified - check inbox'; msg.className='text-[12px] text-center font-semibold text-amber-600'; try{ await sendEmailVerification(cred.user); }catch{} return; }
      msg.textContent='✓ Verified';
    }catch(e){ msg.textContent=e.code ? `${e.code}: ${e.message.replace('Firebase:','').trim()}` : e.message; msg.className='text-[12px] text-center font-semibold text-red-600'; }
    finally{ btn.disabled=false; btn.textContent='LOGIN'; }
  };
}

function renderVerifyRequired(user){
  document.getElementById('app').innerHTML=`
  <div class="min-h-screen flex items-center justify-center p-4 bg-[#F8F7FF]">
    <div class="w-full max-w-[420px] bg-white rounded-[28px] shadow p-8 text-center">
      <div class="w-16 h-16 rounded-full bg-amber-100 grid place-items-center mx-auto text-[28px]">✉️</div>
      <h2 class="mt-4 text-[22px] font-bold">Verify your email</h2>
      <p class="mt-2 text-[13px] text-[#6B7280]">You cannot proceed until email is authenticated. Link sent to <b>${user.email}</b></p>
      <div class="mt-6 space-y-2">
        <button id="btnCheckVerified" class="w-full h-12 rounded-full bg-[#111827] text-white font-bold text-[13px]">I HAVE VERIFIED - CONTINUE</button>
        <button id="btnResend" class="w-full h-12 rounded-full bg-[#F8F7FF] border font-bold text-[13px]">RESEND EMAIL</button>
        <button id="btnLogout2" class="w-full h-11 rounded-full bg-white border text-[12px] font-bold">Logout</button>
      </div>
      <div id="verifyMsg" class="mt-3 text-[12px] font-semibold min-h-[20px]"></div>
    </div>
  </div>`;
  $('btnCheckVerified').onclick=async()=>{
    $('verifyMsg').textContent='Checking...';
    try{ await user.reload(); if(user.emailVerified){ try{ await updateDoc(doc(db,'users',user.uid),{ emailVerified:true }); await updateDoc(doc(db,'salesforce_agents',sanitizeEmail(user.email.toLowerCase())),{ emailVerified:true }); }catch{} toast('Verified'); }else{ $('verifyMsg').textContent='Not verified yet'; $('verifyMsg').className='mt-3 text-[12px] font-semibold text-red-600'; } }catch(e){ $('verifyMsg').textContent=e.message; }
  };
  $('btnResend').onclick=async()=>{ try{ await sendEmailVerification(user); $('verifyMsg').textContent='✓ Sent again'; toast('Sent'); }catch(e){ $('verifyMsg').textContent=e.message; } };
  $('btnLogout2').onclick=async()=>{ await signOut(auth); };
}

let _teamData=[], _teamFilter='all', _allTxns=[];
function renderTeamList(){
  const list=$('teamList'); if(!list) return;
  let data=_teamData; if(_teamFilter!=='all') data=data.filter(d=>d.memberRole===_teamFilter);
  if(data.length===0){ list.innerHTML=`<div class="text-[12px] text-[#9CA3AF]">No ${ _teamFilter==='all'?'team':_teamFilter } yet</div>`; return; }
  list.innerHTML=data.map(m=>`<div class="flex justify-between items-center p-3 rounded-[14px] bg-[#F8F7FF] border"><div><div class="font-bold text-[13px]">${m.memberName}</div><div class="text-[11px] text-[#6B7280]">${m.memberRole} • ${m.memberEmail}</div></div><div class="text-[10px] px-2 py-1 rounded-full bg-white border font-bold uppercase">${m.memberRole}</div></div>`).join('');
}

function renderFlow(){
  const list=$('flowList'); if(!list) return;
  const commissions=_allTxns.filter(t=>t.type==='commission');
  if(commissions.length===0){ list.innerHTML=`<div class="text-[12px] text-[#9CA3AF] p-4 bg-[#F8F7FF] border rounded-[14px] text-center">No earnings yet<br><span class="text-[11px]">When your team completes trips, it will show like:<br><b>Jake (driver) completed a trip of NGN3,100 → You earned NGN62 (2%)</b></span></div>`; return; }
  list.innerHTML=commissions.map(t=>{
    // Parse description for realistic flow
    const isDriver = (t.memberRole||'').includes('driver') || t.description?.toLowerCase().includes('driver');
    const icon = isDriver ? '🛵' : (t.description?.toLowerCase().includes('chef') ? '🍳' : '📦');
    return `<div class="p-3 rounded-[14px] bg-[#F8F7FF] border flex justify-between items-center">
      <div class="flex gap-3 items-center">
        <div class="w-10 h-10 rounded-full bg-white border grid place-items-center text-[18px]">${icon}</div>

          <div class="font-bold text-[13px]">${t.memberName||''} ${t.memberRole ? `(${t.memberRole})` : ''} ${t.memberRole ? 'completed' : ''}</div>
          <div class="text-[11px] text-[#6B7280]">${t.description||''} • ${t.createdAt?.toDate?.()?.toLocaleString()||''}</div>
          <div class="text-[10px] mt-1"><span class="bg-white border px-2 py-0.5 rounded-full">Trip: ₦${(t.orderAmount||0).toLocaleString()}</span> <span class="bg-[#7C3AED] text-white px-2 py-0.5 rounded-full ml-1">You: 2% = ₦${(t.amount||0).toLocaleString()}</span></div>
        </div>
      </div>
      <div class="text-right"><div class="font-black text-[#7C3AED]">+₦${(t.amount||0).toLocaleString()}</div><div class="text-[10px] text-green-600 font-bold">EARNED</div></div>
    </div>`;
  }).join('');
}

async function loadUserData(){
  if(!currentUser) return;
  const uid=currentUser.uid, email=currentUser.email.toLowerCase(), emailKey=sanitizeEmail(email);
  if(unsubUser) unsubUser();
  unsubUser=onSnapshot(doc(db,'users',uid),(snap)=>{ if(snap.exists()){ userData=snap.data(); updateUI(); } else { getDoc(doc(db,'salesforce_agents',emailKey)).then(d=>{ if(d.exists()){ userData=d.data(); updateUI(); } }); } });
  if(unsubWallet) unsubWallet();
  unsubWallet=onSnapshot(doc(db,'wallets',emailKey),
    (snap)=>{ const balEl=$('walletBal'), emailEl=$('walletEmail'); if(snap.exists()){ const w=snap.data(); if(balEl) balEl.textContent=`₦${(w.balance||0).toLocaleString()}`; if(emailEl) emailEl.textContent=w.email||email; } else { if(balEl) balEl.textContent=`₦0`; if(emailEl) emailEl.textContent=email; } },
    (err)=>{ console.error(err); }
  );
  if(unsubTxns) unsubTxns();
  const qTxn=query(collection(db,'transactions'),where('uid','==',uid));
  unsubTxns=onSnapshot(qTxn,
    (snap)=>{
      _allTxns=snap.docs.map(d=>({id:d.id,...d.data()}));
      _allTxns.sort((a,b)=> (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
      renderFlow();
      // Wallet history in profile page
      const wList=$('walletTxns'); if(wList){ const wTx=_allTxns.filter(t=>t.type==='withdraw_to_wallet'); if(wTx.length===0) wList.innerHTML='<div class="text-[12px] text-[#9CA3AF]">No withdrawals yet</div>'; else wList.innerHTML=wTx.map(t=>`<div class="flex justify-between items-center p-3 rounded-[12px] bg-[#F8F7FF] border"><div><div class="font-bold text-[13px]">To wallet • ${t.walletEmail||email}</div><div class="text-[11px] text-[#6B7280]">${t.reference||''} • ${t.createdAt?.toDate?.()?.toLocaleString()||''}</div></div><div class="font-black">₦${Math.abs(t.amount).toLocaleString()}</div></div>`).join(''); }
      // Update quick stats
      const commissions=_allTxns.filter(t=>t.type==='commission');
      const totalTripsEl=$('statTotalTrips'), totalEarnEl=$('statTotalEarn'), teamSizeEl=$('statTeamSize'), statsOrdersEl=$('statsOrders'), statsEarnedEl=$('statsEarned');
      if(totalTripsEl) totalTripsEl.textContent=commissions.length;
      if(statsOrdersEl) statsOrdersEl.textContent=commissions.length;
      const totalComm=commissions.reduce((s,t)=>s+(t.amount||0),0);
      if(totalEarnEl) totalEarnEl.textContent=`₦${totalComm.toLocaleString()}`;
      if(statsEarnedEl) statsEarnedEl.textContent=`₦${totalComm.toLocaleString()}`;
    },
    (err)=>{ console.error('txn err',err); }
  );
  if(unsubTeam) unsubTeam();
  const qTeam=query(collection(db,'salesforce_teams'),where('salesforceEmail','==',email));
  unsubTeam=onSnapshot(qTeam,
    (snap)=>{
      _teamData=snap.docs.map(d=>d.data());
      _teamData.sort((a,b)=> (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
      const totalEl=$('teamTotal'), provEl=$('providerCount'), custEl=$('customerCount'), teamSizeEl=$('statTeamSize'), statsTeamEl=$('statsTeam');
      if(totalEl) totalEl.textContent=`${_teamData.length} team`;
      if(provEl) provEl.textContent=_teamData.filter(t=>['driver','rider','chef'].includes(t.memberRole)).length;
      if(custEl) custEl.textContent=_teamData.filter(t=>t.memberRole==='customer').length;
      if(teamSizeEl) teamSizeEl.textContent=_teamData.length;
      if(statsTeamEl) statsTeamEl.textContent=_teamData.length;
      // breakdown
      const bD=$('bDrivers'), bR=$('bRiders'), bC=$('bChefs'), bCu=$('bCustomers');
      if(bD) bD.textContent=_teamData.filter(t=>t.memberRole==='driver').length;
      if(bR) bR.textContent=_teamData.filter(t=>t.memberRole==='rider').length;
      if(bC) bC.textContent=_teamData.filter(t=>t.memberRole==='chef').length;
      if(bCu) bCu.textContent=_teamData.filter(t=>t.memberRole==='customer').length;
      renderTeamList();
    },
    (err)=>{ console.error('team err',err); }
  );
  function updateUI(){
    if(!userData) return;
    const nameEl=$('dashName'), earnEl=$('totalEarned'), pName=$('profileName'), pEmail=$('profileEmail'), pInit=$('profileInitial'), pfName=$('pfName'), pfPhone=$('pfPhone'), pfEmail=$('pfEmail');
    if(nameEl) nameEl.textContent=userData.name||'Salesforce';
    if(earnEl) earnEl.textContent=`₦${(userData.totalEarned||0).toLocaleString()}`;
    if(pName) pName.textContent=userData.name||'Salesforce';
    if(pEmail) pEmail.textContent=userData.email||email;
    if(pInit) pInit.textContent=(userData.name||'S').charAt(0).toUpperCase();
    if(pfName) pfName.value=userData.name||'';
    if(pfPhone) pfPhone.value=userData.phone||'';
    if(pfEmail) pfEmail.value=userData.email||email;
  }
}

async function quickOnboard(){
  const btn=$('btnOnboard'), name=$('obName').value.trim(), phone=$('obPhone').value.trim(), role=$('obRole').value, email=$('obEmail').value.trim().toLowerCase(), extra=$('obExtra').value.trim();
  const msg=$('obMsg'); if(!name||!phone||!email){ msg.textContent='Fill all fields'; msg.className='text-[11px] text-center font-semibold text-red-600'; return; }
  btn.disabled=true; btn.textContent='ONBOARDING...'; msg.textContent='Onboarding...'; msg.className='text-[11px] text-center font-semibold text-[#6B7280]';
  try{
    const salesforceEmail=currentUser.email.toLowerCase(), memberKey=sanitizeEmail(email);
    const teamDoc={ salesforceEmail, salesforceKey:sanitizeEmail(salesforceEmail), memberEmail:email, memberKey, memberRole:role, memberName:name, memberPhone:phone, memberExtra:extra, createdAt: serverTimestamp() };
    await addDoc(collection(db,'salesforce_teams'),teamDoc);
    _teamData.unshift({ ...teamDoc, createdAt: { seconds: Date.now()/1000 } });
    renderTeamList();
    const totalEl=$('teamTotal'); if(totalEl) totalEl.textContent=`${_teamData.length} team`;
    try{ await setDoc(doc(db,'onboarded_members',memberKey),{ name, phone, email, role, extra, onboardedByEmail:salesforceEmail, createdAt: serverTimestamp() },{merge:true}); const base={ name, email, phone, role, onboardedByEmail:salesforceEmail, bikeNumber:extra, createdAt: serverTimestamp(), emailKey:memberKey }; if(role==='driver') await setDoc(doc(db,'drivers',memberKey),{...base,id:memberKey,totalEarnings:0},{merge:true}); if(role==='rider') await setDoc(doc(db,'riders',memberKey),{...base,id:memberKey},{merge:true}); if(role==='chef') await setDoc(doc(db,'chefs',memberKey),{...base,id:memberKey},{merge:true}); if(role==='customer') await setDoc(doc(db,'customers',memberKey),{...base,id:memberKey},{merge:true}); await setDoc(doc(db,'wallets',memberKey),{ email, emailKey:memberKey, balance:0, name, createdAt: serverTimestamp(), updatedAt: serverTimestamp() },{merge:true}); }catch(e){ console.error(e); }
    msg.textContent=`✓ ${role} ${name} onboarded`; msg.className='text-[11px] text-center font-semibold text-green-600'; toast(`${role} onboarded`);
    $('obName').value=''; $('obPhone').value=''; $('obEmail').value=''; $('obExtra').value='';
  }catch(e){ msg.textContent=e.message; msg.className='text-[11px] text-center font-semibold text-red-600'; toast(e.message,'err'); }
  finally{ btn.disabled=false; btn.textContent='ONBOARD'; }
}

async function simulateTeamOrder(){
  if(_teamData.length===0){ toast('Onboard someone first','err'); return; }
  const orderAmtStr=prompt('Enter trip/order amount (e.g. 3100) - e.g. Jake trip NGN3100:','3100'); if(!orderAmtStr) return;
  const orderAmt=Number(orderAmtStr.replace(/[^0-9]/g,'')); if(!orderAmt){ toast('Invalid','err'); return; }
  const comm=Math.floor(orderAmt*0.02);
  // Pick random member or ask for name
  const member=_teamData[Math.floor(Math.random()*_teamData.length)];
  try{
    await setDoc(doc(collection(db,'transactions')),{
      uid: currentUser.uid,
      email: currentUser.email.toLowerCase(),
      emailKey: sanitizeEmail(currentUser.email.toLowerCase()),
      amount: comm,
      orderAmount: orderAmt,
      memberName: member.memberName,
      memberRole: member.memberRole,
      memberEmail: member.memberEmail,
      type:'commission',
      description:`${member.memberName} (${member.memberRole}) completed a trip/order of NGN${orderAmt.toLocaleString()} → You earned 2%`,
      reference:'ORD-'+Date.now(),
      status:'success',
      createdAt: serverTimestamp()
    });
    await updateDoc(doc(db,'users',currentUser.uid),{ totalEarned: increment(comm) });
    try{ await updateDoc(doc(db,'salesforce_agents',sanitizeEmail(currentUser.email.toLowerCase())),{ totalEarned: increment(comm) }); }catch{}
    toast(`Flow: ${member.memberName} (${member.memberRole}) completed NGN${orderAmt.toLocaleString()} → You earned NGN${comm} (2%)`);
    switchPage('flow');
  }catch(e){ toast(e.message,'err'); }
}

async function withdrawToWallet(){
  if(!currentUser||!userData){ toast('No account','err'); return; }
  const email=currentUser.email.toLowerCase(), emailKey=sanitizeEmail(email); const amount=Number(userData.totalEarned||0);
  if(amount<=0){ toast('No earnings','err'); return; }
  const btn=$('btnWithdraw'); btn.textContent='PROCESSING...'; btn.disabled=true;
  try{
    const walletRef=doc(db,'wallets',emailKey); const snap=await getDoc(walletRef);
    if(!snap.exists()) await setDoc(walletRef,{ email, emailKey, uid: currentUser.uid, balance:0, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
    await setDoc(doc(collection(db,'transactions')),{ uid: currentUser.uid, email, emailKey, walletEmail: email, amount: -amount, type:'withdraw_to_wallet', description:`Withdraw to wallet`, reference:'WTH_'+Date.now(), status:'success', createdAt: serverTimestamp() });
    await updateDoc(walletRef,{ balance: increment(amount), updatedAt: serverTimestamp() });
    await updateDoc(doc(db,'users',currentUser.uid),{ totalEarned: 0 });
    try{ await updateDoc(doc(db,'salesforce_agents',emailKey),{ totalEarned: 0 }); }catch{}
    toast(`✓ ₦${amount.toLocaleString()} moved to wallet`);
  }catch(e){ toast(e.message,'err'); }finally{ btn.textContent='WITHDRAW TO WALLET'; btn.disabled=false; }
}

async function saveProfile(){
  const name=$('pfName').value.trim(), phone=$('pfPhone').value.trim(), msg=$('pfMsg');
  if(!name||!phone){ msg.textContent='Fill name & phone'; msg.className='text-[11px] text-center font-semibold text-red-600'; return; }
  msg.textContent='Saving...'; msg.className='text-[11px] text-center font-semibold text-[#6B7280]';
  try{
    await updateDoc(doc(db,'users',currentUser.uid),{ name, phone });
    await updateDoc(doc(db,'salesforce_agents',sanitizeEmail(currentUser.email.toLowerCase())),{ name, phone });
    try{ await updateProfile(currentUser,{ displayName:name }); }catch{}
    msg.textContent='✓ Saved'; msg.className='text-[11px] text-center font-semibold text-green-600'; toast('Profile saved');
  }catch(e){ msg.textContent=e.message; msg.className='text-[11px] text-center font-semibold text-red-600'; }
}

onAuthStateChanged(auth, async (user)=>{
  if(user){
    try{ await user.reload(); }catch{}
    currentUser=user;
    if(!user.emailVerified){ renderVerifyRequired(user); return; }
    renderDashboard();
  }else{
    currentUser=null; userData=null;
    if(unsubUser) unsubUser(); if(unsubTxns) unsubTxns(); if(unsubWallet) unsubWallet(); if(unsubTeam) unsubTeam();
    renderAuth();
  }
});
renderAuth();
